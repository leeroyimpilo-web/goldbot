name: Build WorldLive APK

on:
  push:
    branches: [worldlive-build]
    paths:
      - 'worldlive/**'
      - '.github/workflows/worldlive-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        working-directory: worldlive
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp worldlive/app/build/outputs/apk/debug/app-debug.apk WorldLive-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldLive-APK
          path: WorldLive-v1.apk
          if-no-files-found: error
          retention-days: 30
