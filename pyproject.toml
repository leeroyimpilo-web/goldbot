[project]
name = "goldbot-ai"
version = "0.1.0"
description = "Research-first XAUUSD trading and strategy-learning platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "numpy>=2.0"
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["mql5*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
